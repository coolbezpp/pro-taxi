# Раздача векторных тайлов PMTiles (Range-запросы поддерживаются штатно)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location ~ \.pmtiles$ {
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=3600";
        # Range и If-Range поддержаны nginx для статики из коробки
    }

    location = /attribution.txt {
        default_type text/plain;
        return 200 "© OpenStreetMap contributors";
    }
}
