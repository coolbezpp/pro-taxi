# Раздача векторных тайлов PMTiles (Range-запросы поддерживаются штатно)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location ~ \.pmtiles$ {
        add_header Access-Control-Allow-Origin *;
        # PMTiles-файл статичен (версия в ETag) — кэшируем надолго,
        # чтобы навигация по карте не триггерала перевалидацию 171-МБ архива
        # каждый час (max-age=3600 раньше заставляло браузер/протокол
        # пере-запрашивать metadata при каждом заходе на тайлы).
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Range и If-Range поддержаны nginx для статики из коробки
    }

    location = /attribution.txt {
        default_type text/plain;
        return 200 "© OpenStreetMap contributors";
    }
}
