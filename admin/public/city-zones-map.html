<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ПРО — городские зоны</title>
<link rel="stylesheet" href="./vendor/openlayers/ol.css">
<style>
*{box-sizing:border-box}
body{margin:0;padding:12px;background:#f4f6f8;color:#202334;font:14px system-ui}
button,input{font:inherit}
button{padding:11px 14px;margin:4px 6px 4px 0;border:0;border-radius:10px;background:#6545ed;color:white;cursor:pointer}
button:disabled{opacity:.45;cursor:wait}
input{width:100%;padding:12px;margin:5px 0 12px;border:1px solid #ddd;border-radius:10px}
#map{height:55vh;min-height:350px;background:#e7ebf0;border-radius:12px;overflow:hidden}
.card{background:white;padding:16px;border:1px solid #e4e7ec;border-radius:12px;margin:12px 0}
#error{color:#b91c1c;white-space:pre-wrap}
#message{color:#15803d}
#history{white-space:pre-wrap;overflow-wrap:anywhere}
.danger{background:#dc2626}
.secondary{background:#64748b}
small{color:#657083}
</style>
</head>
<body>
<h2>Городские зоны</h2>
<p>Нарисуйте границу, задайте город и название, сохраните.</p>
<p id="error" role="alert"></p>
<p id="message" role="status">Загрузка карты…</p>

<div id="tools">
<button id="new" disabled>Нарисовать зону</button>
<button id="finish" disabled>Завершить контур</button>
<button id="locate" disabled>Моё положение</button>
<button id="reset" class="secondary" disabled>Сбросить</button>
</div>

<div id="map"></div>

<form id="form" class="card">
<h3 id="form-title">Новая зона</h3>
<label>Город
<input id="city" required maxlength="160" placeholder="Например: Анапа">
</label>
<label>Название зоны
<input id="name" required maxlength="160" placeholder="Например: Центр">
</label>
<button id="save" disabled>Сохранить в базе</button>
<p><small>Вершины завершённого полигона можно перетаскивать.</small></p>
</form>

<h3>Сохранённые зоны</h3>
<button id="reload" disabled>Обновить список</button>
<div id="list"></div>
<div id="history" class="card" hidden></div>

<script>
window.addEventListener("error", function(event) {
  document.getElementById("error").textContent =
    "Ошибка карты: " + (event.message || "не удалось загрузить библиотеку");
});
</script>
<script src="./vendor/openlayers/ol.js"></script>
<script src="./vendor/openlayers/olms.js"></script>
<script>
(async function() {
const $ = id => document.getElementById(id);
const api = "/api/admin/city-zones";
let map, saved, draft, modify, draw = null;
let selectedId = null, zones = [], busy = false, available = false;

function error(text) { $("error").textContent = text; }
function message(text) { $("message").textContent = text; }

function lock(value) {
  busy = value;
  document.querySelectorAll("button").forEach(button => {
    button.disabled = value || !available;
  });
  $("city").disabled = value;
  $("name").disabled = value;
  $("map").style.pointerEvents = value ? "none" : "auto";
  if (modify) modify.setActive(!value && !draw);
}

async function request(url, options = {}) {
  const response = await fetch(url, {
    ...options,
    credentials: "include",
    headers: {
      ...(options.body ? {"Content-Type":"application/json"} : {}),
      ...options.headers
    }
  });
  const raw = await response.text();
  let data = null;
  try { data = raw ? JSON.parse(raw) : null; } catch {}
  if (!response.ok) {
    const detail = data && data.detail;
    throw new Error(response.status === 401
      ? "Сессия истекла. Войдите в админку и снова откройте вкладку."
      : "HTTP " + response.status + ": " +
        (typeof detail === "string" ? detail :
          detail ? JSON.stringify(detail) : "Ошибка API"));
  }
  return data;
}

try {
  if (!window.ol || !window.olms) {
    throw new Error("Не загрузились локальные библиотеки ol.js / olms.js.");
  }

  const background = new ol.layer.Group();
  saved = new ol.source.Vector();
  draft = new ol.source.Vector();

  map = new ol.Map({
    target: "map",
    layers: [
      background,
      new ol.layer.Vector({
        source: saved,
        style: new ol.style.Style({
          stroke: new ol.style.Stroke({color:"#2563eb",width:2}),
          fill: new ol.style.Fill({color:"rgba(37,99,235,.12)"})
        })
      }),
      new ol.layer.Vector({
        source: draft,
        style: new ol.style.Style({
          stroke: new ol.style.Stroke({color:"#6545ed",width:3}),
          fill: new ol.style.Fill({color:"rgba(101,69,237,.2)"})
        })
      })
    ],
    view: new ol.View({
      center: ol.proj.fromLonLat([37.316,44.895]),
      zoom: 12
    })
  });

  modify = new ol.interaction.Modify({source:draft});
  map.addInteraction(modify);

  olms.apply(background, "/api/admin/map-proxy/styles/liberty")
    .then(() => {
      map.updateSize();
      map.render();
    })
    .catch(e => {
      error("Не удалось загрузить карту: " + e.message);
    });

  available = true;
  lock(false);
  message("Карта готова. Начальный город — Анапа.");
} catch(e) {
  error(e.message);
  message("");
  return;
}

const format = new ol.format.GeoJSON();
const projection = {
  dataProjection:"EPSG:4326",
  featureProjection:"EPSG:3857"
};

function featureFrom(zone) {
  const geometry = typeof zone.geometry === "string"
    ? JSON.parse(zone.geometry) : zone.geometry;
  if (!geometry || geometry.type !== "Polygon") {
    throw new Error("Ожидается геометрия Polygon.");
  }
  return format.readFeature({
    type:"Feature",geometry,properties:{}
  },projection);
}

function stopDrawing() {
  if (draw) {
    draw.abortDrawing();
    map.removeInteraction(draw);
    draw = null;
  }
  modify.setActive(!busy);
}

function reset() {
  stopDrawing();
  draft.clear();
  selectedId = null;
  $("city").value = "";
  $("name").value = "";
  $("form-title").textContent = "Новая зона";
  $("history").hidden = true;
  renderSaved();
}

function discardAllowed() {
  return (!draw && !draft.getFeatures().length) ||
    confirm("Несохранённая граница будет сброшена. Продолжить?");
}

function renderSaved() {
  saved.clear();
  for (const zone of zones) {
    if (zone.id === selectedId) continue;
    try { saved.addFeature(featureFrom(zone)); }
    catch(e) { error("Зона №" + zone.id + ": " + e.message); }
  }
}

function makeButton(text, action, danger = false) {
  const button = document.createElement("button");
  button.type = "button";
  button.textContent = text;
  button.disabled = busy;
  if (danger) button.className = "danger";
  button.onclick = action;
  return button;
}

function renderList() {
  $("list").replaceChildren();
  if (!zones.length) {
    $("list").textContent = "Сохранённых зон нет.";
    return;
  }
  for (const zone of zones) {
    const card = document.createElement("div");
    card.className = "card";
    const title = document.createElement("strong");
    title.textContent = zone.city + " — " + zone.name;
    const info = document.createElement("p");
    info.textContent = "№" + zone.id + " · Версия " + zone.version;
    card.append(title,info);

    card.append(makeButton("Показать / изменить", () => {
      if (busy || !discardAllowed()) return;
      try {
        const feature = featureFrom(zone);
        reset();
        selectedId = zone.id;
        draft.addFeature(feature);
        $("city").value = zone.city;
        $("name").value = zone.name;
        $("form-title").textContent = "Изменение зоны №" + zone.id;
        renderSaved();
        map.getView().fit(feature.getGeometry(), {
          padding:[35,35,35,35],maxZoom:16,duration:250
        });
        error("");
        message("Двигайте вершины границы, затем сохраните.");
      } catch(e) { error(e.message); }
    }));

    card.append(makeButton("История", async () => {
      if (busy) return;
      try {
        const data = await request(api + "/" + zone.id + "/history");
        $("history").hidden = false;
        $("history").textContent = "История: " + zone.name + "\n\n" +
          (data.history || []).map(entry =>
            "Версия " + entry.version + " · " +
            entry.action + " · " + entry.created_at
          ).join("\n");
      } catch(e) { error(e.message); }
    }));

    card.append(makeButton("Удалить", async () => {
      if (busy || !confirm("Удалить зону «" + zone.name + "»?")) return;
      lock(true);
      error("");
      try {
        await request(api + "/" + zone.id,{method:"DELETE"});
        if (selectedId === zone.id) reset();
        $("history").hidden = true;
        message("Зона удалена.");
        await reload();
      } catch(e) { error(e.message); }
      finally { lock(false); }
    },true));

    $("list").append(card);
  }
}

async function reload() {
  const data = await request(api);
  if (!data || !Array.isArray(data.zones)) {
    throw new Error("API вернул неожиданный формат зон.");
  }
  zones = data.zones;
  renderSaved();
  renderList();
}

$("new").onclick = () => {
  if (busy || !discardAllowed()) return;
  reset();
  error("");
  modify.setActive(false);
  const interaction = new ol.interaction.Draw({
    source:draft,type:"Polygon"
  });
  draw = interaction;
  map.addInteraction(interaction);

  interaction.on("drawend", () => {
    setTimeout(() => {
      if (draw !== interaction) return;
      map.removeInteraction(interaction);
      draw = null;
      modify.setActive(true);
      message("Граница готова. Введите город и название, затем сохраните.");
    },0);
  });
  message("Ставьте точки. Для завершения нажмите первую точку.");
};

$("finish").onclick = () => {
  if (draw) draw.finishDrawing();
};

$("reset").onclick = () => {
  if (discardAllowed()) {
    reset();
    error("");
    message("Форма очищена.");
  }
};

$("reload").onclick = async () => {
  error("");
  lock(true);
  try { await reload(); }
  catch(e) { error(e.message); }
  finally { lock(false); }
};

$("form").onsubmit = async event => {
  event.preventDefault();
  if (busy) return;
  if (draw) { error("Сначала завершите контур."); return; }

  const features = draft.getFeatures();
  if (features.length !== 1) {
    error("Сначала нарисуйте одну границу."); return;
  }

  const city = $("city").value.trim();
  const name = $("name").value.trim();
  if (!city || !name) {
    error("Укажите город и название."); return;
  }

  const payload = {
    city,name,
    geometry:format.writeGeometryObject(
      features[0].getGeometry(),projection
    )
  };
  const url = selectedId === null ? api : api + "/" + selectedId;
  const method = selectedId === null ? "POST" : "PUT";

  lock(true);
  error("");
  message("");
  try {
    await request(url,{method,body:JSON.stringify(payload)});
    reset();
    message("Зона сохранена в базе.");
    await reload();
  } catch(e) { error(e.message); }
  finally { lock(false); }
};

$("locate").onclick = () => {
  if (!navigator.geolocation) {
    error("Браузер не поддерживает геолокацию."); return;
  }
  navigator.geolocation.getCurrentPosition(position => {
    map.getView().animate({
      center:ol.proj.fromLonLat([
        position.coords.longitude,position.coords.latitude
      ]),
      zoom:15,duration:300
    });
    message("Карта перемещена к вашему положению. Точность около " +
      Math.round(position.coords.accuracy) + " м.");
  },e => error("Геолокация недоступна: " + e.message),{
    enableHighAccuracy:true,timeout:15000,maximumAge:30000
  });
};

try { await reload(); }
catch(e) { error(e.message); }
})();
</script>
</body>
</html>
